version: "2"

run:
  timeout: 5m
  # Build tag sengaja tidak diset di sini: `task lint` menjalankan dua putaran (tanpa tag, lalu
  # --build-tags=integration,devtools) agar flavor rilis dan file ber-tag sama-sama terlint.

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - gosec
    - revive
    - misspell
  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (*text/tabwriter.Writer).Flush
    misspell:
      ignore-rules:
        - variabel
        - implementasi
    revive:
      rules:
        - name: exported
          disabled: true
        - name: package-comments
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters: [gosec, errcheck]

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - erpora
