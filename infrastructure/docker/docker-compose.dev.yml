# PostgreSQL lokal untuk pengembangan: `task db:up` / `task db:down`.
# Image dipin ke major stabil terbaru (18); sama dengan internal/platform/testsupport/pgtest.
services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: erp
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - erp_pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d erp"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  erp_pgdata:
