name: CI

on:
  pull_request:
    # labeled/unlabeled: menambah atau mencabut label api-breaking-approved memicu ulang gate kontrak (K-2).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.4.2"
  TASK_VERSION: "3.54.0"
  GOLANGCI_LINT_VERSION: "v2.15.0"
  CYCLONEDX_GOMOD_VERSION: "v1.9.0"
  POSTGRES_IMAGE: postgres:18-alpine

# Semua action di-pin ke commit SHA (komentar = versi). Perbarui lewat Dependabot/Renovate.
jobs:
  go-checks:
    name: go-checks
    runs-on: ubuntu-latest
    env:
      ERP_REQUIRE_BUN: "1" # test lint/generate kontrak butuh Bun; tidak boleh di-skip diam-diam
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      # golangci-lint terpin (GOLANGCI_LINT_VERSION) dipasang dari sumber dengan Go dari go.mod (goinstall),
      # lalu `task lint` menjalankannya di SETIAP Go module workspace sehingga modul baru otomatis ikut.
      - name: pasang golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          install-only: true
      - run: task lint
      # arch (D1-D11), build GOWORK=off, unit test, govulncheck
      - run: task arch check:gowork-off test vuln

  web-checks:
    name: web-checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - run: bun run --filter @erpora/web typecheck
      - run: bun run --filter @erpora/web lint
      - run: bun run --filter @erpora/web deps
      - run: bun test --pass-with-no-tests
      - run: bun run --filter @erpora/web build
      - run: bun audit

  integration:
    name: integration
    runs-on: ubuntu-latest # Docker tersedia untuk testcontainers; termasuk TestServe_GracefulShutdown (!windows)
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: task test:integration

  # Gate kontrak API (FR-14/FR-23): lint Spectral, hasil generate mutakhir, dan breaking change terhadap tag rilis terakhir.
  contracts:
    name: contracts
    runs-on: ubuntu-latest
    env:
      ERP_REQUIRE_BUN: "1"
      # Perubahan breaking hanya lolos bila PR berlabel api-breaking-approved (dan major version manifest naik).
      # Pada push ke main, breaking yang sudah melewati review PR berlabel diterima (selama MAJOR manifest naik); baseline tag
      # baru ada saat rilis. Pada PR tanpa label, breaking yang sudah ada di cabang dasar (ERP_API_BREAKING_BASE_REF) tidak
      # menggagalkan; breaking baru tetap butuh label (K-1).
      # ASUMSI (R-10): penerimaan pada push ke main mensyaratkan branch protection main yang mewajibkan PR + status check "contracts"
      # (diatur di GitHub, tidak dapat diverifikasi dari repo; lihat docs/module-sdk/contracts.md dan docs/operations/deployment.md §10).
      ERP_API_BREAKING_APPROVED: ${{ github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'api-breaking-approved') }}
      ERP_API_BREAKING_BASE_REF: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || '' }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # tag rilis dibutuhkan contracts:breaking
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - run: task contracts:check
      - name: Bangkitkan spec gabungan
        run: task erpora -- contracts:generate
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openapi
          path: contracts/dist/openapi.json
          if-no-files-found: error

  # Bukti bahwa make:module menghasilkan modul yang lolos semua gate dan dapat di-install (FR-22 AC). Lama (belasan menit).
  generator:
    name: generator
    runs-on: ubuntu-latest # Docker tersedia untuk testcontainers
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - name: pasang golangci-lint
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8.0.0
        with:
          version: ${{ env.GOLANGCI_LINT_VERSION }}
          install-mode: goinstall
          install-only: true
      - run: bun install --frozen-lockfile
      - run: task test:generator

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    name: build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [go-checks, web-checks, integration, contracts, generator, secrets]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { goos: linux, goarch: amd64 }
          - { goos: linux, goarch: arm64 }
          - { goos: windows, goarch: amd64 }
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0 # git describe untuk versi
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611 # v2.0.0
        with:
          version: ${{ env.TASK_VERSION }}
          repo-token: ${{ secrets.GITHUB_TOKEN }}
      - run: bun install --frozen-lockfile
      - name: Build (frontend + binary)
        run: task build
      - name: Normalisasi nama binary
        run: |
          if [ "${GOOS}" = "windows" ]; then mv bin/erpora bin/erpora.exe 2>/dev/null || true; fi
          ls -l bin
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: erpora-${{ matrix.goos }}-${{ matrix.goarch }}
          path: bin/erpora*
          if-no-files-found: error

      # SBOM CycloneDX: sekali saja (leg linux/amd64) untuk semua Go module + frontend.
      - name: SBOM Go modules
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          GOOS: ""
          GOARCH: ""
        run: |
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@${CYCLONEDX_GOMOD_VERSION}
          mkdir -p "$GITHUB_WORKSPACE/sbom"
          # Nama berkas tetap (tidak diturunkan dari path module) agar valid untuk upload-artifact
          # dan tahan terhadap rename repo. GOWORK=off: satu SBOM per module (mode workspace menggabungkan semuanya).
          go list -m -f '{{.Path}} {{.Dir}}' | while read -r path dir; do
            case "$path" in
              */modules/*) n="module-${path##*/}" ;;
              */sdk) n="sdk" ;;
              *) n="root" ;;
            esac
            (cd "$dir" && GOWORK=off cyclonedx-gomod mod -licenses -json -output "$GITHUB_WORKSPACE/sbom/sbom-go-${n}.cdx.json")
          done
      # cdxgen tidak membaca bun.lock dan menjalankan npm install sendiri; SBOM frontend dibuat dari
      # bun.lock yang sudah terpasang (--frozen-lockfile), tanpa unduhan tambahan.
      - name: SBOM frontend
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: bun web/sbom.ts sbom/sbom-web.cdx.json
      - name: Periksa SBOM
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        run: |
          ls -l sbom
          test "$(ls sbom | wc -l)" -ge 4
          test -z "$(find sbom -name '*.json' -size -100c)"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        with:
          name: sbom
          path: sbom/
          if-no-files-found: error

  smoke-linux:
    name: smoke-linux
    needs: build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: erp
          POSTGRES_USER: erp
          POSTGRES_PASSWORD: erp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U erp -d erp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      ERP_DATABASE_URL: postgres://erp:erp@127.0.0.1:5432/erp?sslmode=disable
      ERP_HTTP_ADDR: 127.0.0.1:8080
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: erpora-linux-amd64
      - run: chmod +x ./erpora
      - run: ./erpora version
      - name: Bukti binary release tanpa developer tools
        run: |
          ./erpora version | grep -q "flavor: release"
          for cmd in "make:module x" "make:handler" "make:migration" "make:entity" "make:usecase" "make:contract" "make:command" "make:repository" "db:fresh" "db:seed" "contracts:lint" "contracts:generate" "contracts:breaking" "module:check" "doctor" "release:verify-tag v1"; do
            if out="$(./erpora $cmd 2>&1)"; then echo "perintah dev '$cmd' seharusnya gagal" >&2; exit 1; fi
            echo "$out" | grep -q "unknown command" || { echo "keluaran '$cmd' tidak memuat 'unknown command': $out" >&2; exit 1; }
          done
      - run: ./erpora migrate up
      - name: Serve dan cek /readyz
        run: |
          ./erpora serve &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/readyz; then echo; exit 0; fi
            sleep 1
          done
          echo "readyz tidak siap" >&2
          exit 1

  smoke-windows:
    name: smoke-windows
    needs: build
    runs-on: windows-latest
    env:
      ERP_DATABASE_URL: postgres://erp:erp@127.0.0.1:5432/erp?sslmode=disable
      ERP_HTTP_ADDR: 127.0.0.1:8080
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: erpora-windows-amd64
      - name: Jalankan PostgreSQL bawaan runner
        shell: pwsh
        run: |
          & "$env:PGBIN\pg_ctl.exe" start -D "$env:PGDATA" -w
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE ROLE erp LOGIN SUPERUSER PASSWORD 'erp'"
          & "$env:PGBIN\psql.exe" -U postgres -c "CREATE DATABASE erp OWNER erp"
      - name: Migrasi
        shell: pwsh
        run: |
          .\erpora.exe version
          .\erpora.exe migrate up
      - name: Bukti binary release tanpa developer tools
        shell: pwsh
        run: |
          if (-not ((.\erpora.exe version) -match "flavor: release")) { throw "version harus memuat flavor: release" }
          foreach ($cmd in @("make:module x", "make:handler", "make:migration", "make:entity", "make:usecase", "make:contract", "make:command", "make:repository", "db:fresh", "db:seed", "contracts:lint", "contracts:generate", "contracts:breaking", "module:check", "doctor", "release:verify-tag v1")) {
            $parts = $cmd -split " "
            $out = & .\erpora.exe @parts 2>&1 | Out-String
            if ($LASTEXITCODE -eq 0) { throw "perintah dev '$cmd' seharusnya gagal" }
            if ($out -notmatch "unknown command") { throw "keluaran '$cmd' tidak memuat 'unknown command': $out" }
          }
          # Perintah dev terakhir memang gagal; tanpa ini pwsh memakai $LASTEXITCODE-nya sebagai exit code step.
          exit 0
      - name: Serve dan cek /readyz
        shell: pwsh
        run: |
          Start-Process -FilePath .\erpora.exe -ArgumentList "serve" -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 30; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing http://127.0.0.1:8080/readyz
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch { Start-Sleep -Seconds 1 }
          }
          if (-not $ok) { throw "readyz tidak siap" }
