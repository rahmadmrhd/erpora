# Live-reload API untuk web/dev-api.ts (PostgreSQL di VPS lewat tunnel). Sama dengan .air.toml, tetapi tanpa --env-file:
# konfigurasi datang dari environment proses yang disiapkan skrip itu, sehingga tidak butuh berkas .env.
root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -tags devtools -o ./tmp/erpora.exe ./cmd/erpora"
  entrypoint = ["./tmp/erpora.exe", "serve"]
  include_ext = ["go", "sql"]
  exclude_dir = ["web", "tmp", "node_modules", "bin", "docs", ".git", ".superpowers"]
  delay = 200
  stop_on_error = true
  send_interrupt = true
  kill_delay = "500ms"

[log]
  time = false

[misc]
  clean_on_exit = true
