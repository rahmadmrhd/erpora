openapi: 3.1.0
info:
  title: ERPora platform.core
  version: 0.1.0
  description: >
    Endpoint milik platform: bootstrap dan manajemen modul (PRD-000 FR-20.2). Endpoint mutasi
    (POST /api/platform/modules/{key}/{operation}) hanya aktif bila ERP_ENV=development atau
    ERP_MODULES_ADMIN_API=true; selain itu 404 not_found (sebelum permission dievaluasi). Production memakai CLI
    `erpora modules` sampai PRD Identity and Authorization selesai.
servers:
  - url: /
paths:
  /api/bootstrap:
    x-erp-singleton: true
    get:
      operationId: getBootstrap
      summary: Manifest bootstrap untuk frontend
      description: >-
        Daftar modul terkompilasi (tanpa platform.core) dengan status efektif. Status efektif dihitung lifecycle dari status
        tersimpan di store dan kompatibilitas binary (Effective), lalu dipublikasikan ke runtime snapshot yang dibaca endpoint ini.
        Memuat juga bahasa yang didukung dan revisi katalog terjemahan per namespace aktif (i18n). ETag = revision snapshot
        (ditambah penanda revisi katalog bila ada).
      x-erp-public: true
      parameters:
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Manifest.
          headers: { ETag: { $ref: 'erp:common#/components/headers/ETag' } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BootstrapEnvelope' }
              example:
                data:
                  appVersion: 0.1.0
                  tenantId: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
                  modules:
                    - { key: acme.example, slug: example, version: 1.0.0, status: enabled, basePath: /example, offline: false }
                  permissions: []
                  revision: 5
                  features: { modulesAdminApi: true }
                  i18n:
                    defaultLocale: id
                    locales: [{ code: id, name: Bahasa Indonesia }, { code: en, name: English }]
                    revisions: { ui: 3f9a1c20b7d84e55, platform: 8c01d2e9a4b6f730, example: 11aa22bb33cc44dd }
        '304': { description: Tidak berubah (If-None-Match cocok dengan ETag). }
  /api/platform/i18n/{locale}/{namespace}:
    x-erp-singleton: true
    get:
      operationId: getI18nCatalog
      summary: Katalog terjemahan satu namespace dan bahasa
      description: >-
        Katalog efektif (pesan ICU MessageFormat) namespace `ui`, `platform`, atau slug modul aktif pada bahasa yang
        diminta, dengan rantai fallback bahasa sudah digabung (PRD-000 FR-25). `locale` divalidasi terhadap registri
        bahasa dan `namespace` terhadap daftar tertutup (ui, platform, modul aktif); selain itu 404 not_found tanpa
        membedakan penyebabnya. Publik pada fase ini (hanya teks terjemahan). ETag berubah bila isi berubah; selalu
        direvalidasi (Cache-Control private, no-cache).
      x-erp-public: true
      parameters:
        - { $ref: '#/components/parameters/Locale' }
        - { $ref: '#/components/parameters/Namespace' }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Katalog efektif. ETag = hash isi `messages`.
          headers:
            ETag: { $ref: 'erp:common#/components/headers/ETag' }
            Cache-Control: { description: 'private, no-cache', schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/I18nCatalogEnvelope' }
              example:
                data:
                  locale: en
                  namespace: ui
                  revision: 3f9a1c20b7d84e55
                  messages:
                    actions.save: Save
                    pagination.summary: '{total, plural, =0 {No data} one {# item} other {# items}}'
        '304': { description: Tidak berubah (If-None-Match cocok dengan ETag). }
        '404': { $ref: 'erp:common#/components/responses/NotFound' }
  /api/platform/i18n/overrides:
    get:
      operationId: listI18nOverrides
      summary: Daftar override istilah terjemahan tenant
      description: >-
        Override teks katalog milik tenant ini (PRD-000 FR-25, Q34), berpagination halaman dan dapat difilter per
        namespace dan bahasa. Klasifikasi data internal.
      x-erp-permission: platform.i18n.read
      parameters:
        - { name: namespace, in: query, schema: { type: string, maxLength: 50 } }
        - { name: locale, in: query, schema: { type: string, maxLength: 16 } }
        - { $ref: 'erp:common#/components/parameters/Page' }
        - { $ref: 'erp:common#/components/parameters/PageSize' }
      responses:
        '200':
          description: Daftar override terurut (namespace, bahasa, kunci).
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/I18nOverride' } }
                  page: { $ref: 'erp:common#/components/schemas/Page' }
              example:
                data:
                  - { namespace: example, locale: id, key: note.title, message: Klien, etag: '"3f9a1c20b7d84e55"', updatedBy: 'api:dev', updatedAt: '2026-10-29T10:00:00Z' }
                page: { page: 1, pageSize: 25, total: 1, hasMore: false }
        '400': { $ref: 'erp:common#/components/responses/BadRequest' }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '503': { $ref: 'erp:common#/components/responses/NotReady' }
  /api/platform/i18n/overrides/{namespace}/{locale}/{key}:
    put:
      operationId: putI18nOverride
      x-erp-allow-put: true
      summary: Simpan (upsert) satu override istilah
      description: >-
        Mengganti teks bawaan untuk (namespace, locale, key) pada tenant ini. Validasi: namespace aktif dan locale
        terdaftar; key ada di katalog bawaan bahasa default namespace itu; pesan lolos sintaks ICU dalam batas ukuran,
        tanpa HTML, dan memiliki argumen yang sama dengan pesan bawaan. Idempoten: nilai yang sama tidak mengubah
        apa pun dan tidak menaikkan revisi. Hanya aktif bila ERP_ENV=development atau ERP_MODULES_ADMIN_API=true; selain itu
        404 not_found sebelum permission. ETag respons (kuat) dapat dipakai pada If-Match. PUT dipakai (pengecualian api-guidelines §3, x-erp-allow-put) karena resource-nya hanya satu bidang `message` sehingga ganti penuh tidak berisiko menghapus field.
      x-erp-permission: platform.i18n.manage
      parameters:
        - { $ref: '#/components/parameters/OverrideNamespace' }
        - { $ref: '#/components/parameters/OverrideLocale' }
        - { $ref: '#/components/parameters/OverrideKey' }
        - { $ref: 'erp:common#/components/parameters/IfMatch' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/I18nOverrideBody' }
            example: { message: Klien }
      responses:
        '200':
          description: Override tersimpan (atau sudah bernilai sama).
          headers: { ETag: { $ref: 'erp:common#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/I18nOverride' } }
              example:
                data: { namespace: example, locale: id, key: note.title, message: Klien, etag: '"3f9a1c20b7d84e55"', updatedBy: 'api:dev', updatedAt: '2026-10-29T10:00:00Z' }
        '400':
          description: >
            invalid_i18n_override dengan error.details[].code salah satu: unknown_key, invalid_syntax, param_mismatch,
            html_not_allowed, too_long; atau bad_request untuk kerusakan struktur body.
          content: { application/json: { schema: { $ref: 'erp:common#/components/schemas/Error' } } }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '404': { $ref: 'erp:common#/components/responses/NotFound' }
        '412':
          description: >-
            version_mismatch: If-Match tidak cocok dengan ETag override saat ini. Bila barisnya ada, error.details.current
            memuat override terbaru (skema I18nOverride; bentuk lengkap details: I18nOverridePreconditionDetails) sehingga
            klien dapat menyelesaikan bentrok tanpa permintaan tambahan (api-guidelines section 5); bila barisnya belum ada,
            details tidak dikirim.
          content:
            application/json:
              schema: { $ref: 'erp:common#/components/schemas/Error' }
              example:
                error:
                  code: version_mismatch
                  message: Override telah berubah; muat ulang lalu coba lagi.
                  details:
                    current: { namespace: example, locale: id, key: note.title, message: Klien, etag: '"3f9a1c20b7d84e55"', updatedBy: 'api:dev', updatedAt: '2026-10-29T10:00:00Z' }
        '415':
          description: >
            unsupported_media_type: mutasi wajib Content-Type application/json (charset utf-8).
          content: { application/json: { schema: { $ref: 'erp:common#/components/schemas/Error' } } }
        '422': { $ref: 'erp:common#/components/responses/Unprocessable' }
        '503': { $ref: 'erp:common#/components/responses/NotReady' }
    delete:
      operationId: deleteI18nOverride
      summary: Hapus satu override istilah (kembali ke bawaan)
      description: >-
        Menghapus override; revisi namespace dan bahasa naik hanya bila barisnya ada. Namespace atau bahasa tak dikenal,
        atau override yang tidak ada, menghasilkan 404 not_found. Gerbang dan pengamanan sama dengan PUT.
      x-erp-permission: platform.i18n.manage
      parameters:
        - { $ref: '#/components/parameters/OverrideNamespace' }
        - { $ref: '#/components/parameters/OverrideLocale' }
        - { $ref: '#/components/parameters/OverrideKey' }
        - { $ref: 'erp:common#/components/parameters/IfMatch' }
      responses:
        '204': { description: Override dihapus. }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '404': { $ref: 'erp:common#/components/responses/NotFound' }
        '412':
          description: >-
            version_mismatch: If-Match tidak cocok dengan ETag override saat ini. Bila barisnya ada, error.details.current
            memuat override terbaru (skema I18nOverride; bentuk lengkap details: I18nOverridePreconditionDetails) sehingga
            klien dapat menyelesaikan bentrok tanpa permintaan tambahan (api-guidelines section 5); bila barisnya belum ada,
            details tidak dikirim.
          content:
            application/json:
              schema: { $ref: 'erp:common#/components/schemas/Error' }
              example:
                error:
                  code: version_mismatch
                  message: Override telah berubah; muat ulang lalu coba lagi.
                  details:
                    current: { namespace: example, locale: id, key: note.title, message: Klien, etag: '"3f9a1c20b7d84e55"', updatedBy: 'api:dev', updatedAt: '2026-10-29T10:00:00Z' }
        '415':
          description: >
            unsupported_media_type: mutasi wajib Content-Type application/json (charset utf-8).
          content: { application/json: { schema: { $ref: 'erp:common#/components/schemas/Error' } } }
        '503': { $ref: 'erp:common#/components/responses/NotReady' }
  /api/platform/modules:
    get:
      operationId: listModules
      summary: Daftar modul beserta status
      description: Semua modul terkompilasi beserta status efektifnya untuk tenant ini, berpagination halaman.
      x-erp-permission: platform.modules.read
      parameters:
        - { $ref: 'erp:common#/components/parameters/Page' }
        - { $ref: 'erp:common#/components/parameters/PageSize' }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Daftar modul (urut topologis; modul missing di akhir). ETag = revision.
          headers: { ETag: { $ref: 'erp:common#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Module' } }
                  page: { $ref: 'erp:common#/components/schemas/Page' }
              example:
                data:
                  - key: acme.example
                    slug: example
                    name: Example
                    binaryVersion: 1.0.0
                    installedVersion: 1.0.0
                    status: enabled
                    required: false
                    compatible: true
                    incompatibleCodes: []
                    dependencies: [{ module: platform.core, version: '^0.1', optional: false }]
                    dependents: []
                    lastOperationId: null
                page: { page: 1, pageSize: 25, total: 1, hasMore: false }
        '304': { description: Tidak berubah. }
        '400': { $ref: 'erp:common#/components/responses/BadRequest' }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '503': { $ref: 'erp:common#/components/responses/NotReady' }
  /api/platform/modules/{key}:
    get:
      operationId: getModule
      summary: Detail satu modul
      description: Status satu modul untuk tenant ini; key tidak dikenal menghasilkan 404 not_found.
      x-erp-permission: platform.modules.read
      parameters:
        - { $ref: '#/components/parameters/Key' }
        - { name: If-None-Match, in: header, schema: { type: string } }
      responses:
        '200':
          description: Modul. ETag = revision.
          headers: { ETag: { $ref: 'erp:common#/components/headers/ETag' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Module' } }
              example:
                data:
                  key: acme.example
                  slug: example
                  name: Example
                  binaryVersion: 1.0.0
                  installedVersion: 1.0.0
                  status: enabled
                  required: false
                  compatible: true
                  incompatibleCodes: []
                  dependencies: [{ module: platform.core, version: '^0.1', optional: false }]
                  dependents: []
                  lastOperationId: null
        '304': { description: Tidak berubah. }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '404': { $ref: 'erp:common#/components/responses/NotFound' }
  /api/platform/modules/{key}/history:
    x-erp-singleton: true
    get:
      operationId: listModuleHistory
      summary: Riwayat event lifecycle modul (terbaru dulu)
      description: >
        Diimplementasi oleh route terdaftar GET /api/platform/modules/{key}/{sub} (sub = history) karena
        ServeMux menolak GET /modules/{key}/history bersama GET /modules/operations/{id} sebagai bentrok.
      x-erp-permission: platform.modules.read
      parameters:
        - { $ref: '#/components/parameters/Key' }
        - { $ref: 'erp:common#/components/parameters/Page' }
        - { $ref: 'erp:common#/components/parameters/PageSize' }
      responses:
        '200':
          description: Event lifecycle tenant ini saja.
          content:
            application/json:
              schema:
                type: object
                required: [data, page]
                properties:
                  data: { type: array, items: { $ref: '#/components/schemas/Event' } }
                  page: { $ref: 'erp:common#/components/schemas/Page' }
              example:
                data:
                  - id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5b
                    moduleKey: acme.example
                    event: enabled
                    actor: cli:admin
                    operationId: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
                    details: {}
                    occurredAt: '2026-10-21T07:15:00Z'
                page: { page: 1, pageSize: 25, total: 1, hasMore: false }
        '400': { $ref: 'erp:common#/components/responses/BadRequest' }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '404': { $ref: 'erp:common#/components/responses/NotFound' }
  /api/platform/modules/operations/{id}:
    get:
      operationId: getModuleOperation
      summary: Status satu operasi lifecycle (polling untuk respons 202)
      description: >
        Operasi milik tenant lain atau yang tidak ada -> 404 not_found (bukan 403). Diimplementasi oleh route
        terdaftar GET /api/platform/modules/{key}/{sub} dengan key = operations.
      x-erp-permission: platform.modules.read
      parameters:
        - { name: id, in: path, required: true, schema: { $ref: 'erp:common#/components/schemas/Uuid' } }
      responses:
        '200':
          description: Operasi.
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties: { data: { $ref: '#/components/schemas/Operation' } }
              example:
                data:
                  id: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
                  moduleKey: acme.example
                  operation: enable
                  fromVersion: 1.0.0
                  toVersion: 1.0.0
                  status: succeeded
                  steps: [{ name: 'hook:enable', status: succeeded, startedAt: '2026-10-21T07:15:00Z', durationMs: 15, error: null }]
                  failure: null
                  actor: cli:admin
                  startedAt: '2026-10-21T07:15:00Z'
                  finishedAt: '2026-10-21T07:15:01Z'
        '400': { $ref: 'erp:common#/components/responses/BadRequest' }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '404': { $ref: 'erp:common#/components/responses/NotFound' }
  /api/platform/modules/{key}/{operation}:
    post:
      operationId: runModuleOperation
      summary: Jalankan operasi lifecycle (install, enable, disable, upgrade, uninstall, retry)
      description: >
        Hanya aktif di development atau dengan ERP_MODULES_ADMIN_API=true (selain itu 404 not_found).
        Sinkron dengan batas tunggu 30 detik; bila lebih lama -> 202 + Location ke operations/{id} dan operasi
        berlanjut di server (berlaku juga untuk retry). Operasi yang berstatus failed tetap 200 dengan
        operations[].status = failed. Idempoten: operasi yang status targetnya sudah tercapai -> 200 dengan
        operations kosong. Idempotency-Key diterima tetapi tidak disimpan. Kode error lifecycle (FR-19) ada di
        error.details[].code.
      x-erp-permission: platform.modules.manage
      parameters:
        - { $ref: '#/components/parameters/Key' }
        - name: operation
          in: path
          required: true
          schema: { type: string, enum: [install, enable, disable, upgrade, uninstall, retry] }
        - { $ref: 'erp:common#/components/parameters/IfMatch' }
        - { $ref: 'erp:common#/components/parameters/IdempotencyKey' }
      requestBody:
        required: false
        description: >
          Hanya untuk install; maksimal 4 KiB, Content-Type application/json, satu objek, field tak dikenal ditolak
          (422 unknown_field). Body kosong diterima.
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ActionBody' }
            example: { withDeps: true, enable: true }
      responses:
        '200':
          description: Operasi selesai (sukses, gagal, atau no-op).
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [module, operations]
                    properties:
                      module: { $ref: '#/components/schemas/Module' }
                      operations: { type: array, items: { $ref: '#/components/schemas/Operation' } }
                      operationIds: { type: array, description: 'ID semua operasi pada rangkaian (aditif; urut eksekusi, tanpa noop).', items: { $ref: 'erp:common#/components/schemas/Uuid' } }
              example:
                data:
                  module:
                    key: acme.example
                    slug: example
                    name: Example
                    binaryVersion: 1.0.0
                    installedVersion: 1.0.0
                    status: enabled
                    required: false
                    compatible: true
                    incompatibleCodes: []
                    dependencies: [{ module: platform.core, version: '^0.1', optional: false }]
                    dependents: []
                    lastOperationId: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c
                  operations: []
                  operationIds: []
        '202':
          description: Belum selesai dalam 30 detik; pantau lewat Location.
          headers: { Location: { $ref: 'erp:common#/components/headers/Location' } }
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [operationId, operationIds, status]
                    properties:
                      operationId: { $ref: 'erp:common#/components/schemas/Uuid' }
                      operationIds: { type: array, description: 'ID semua operasi rangkaian yang sudah dimulai saat respons dikirim (aditif); operationId dan Location menunjuk yang pertama.', items: { $ref: 'erp:common#/components/schemas/Uuid' } }
                      status: { type: string, enum: [running] }
              example: { data: { operationId: 0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c, operationIds: [0190a1b2-c3d4-7e5f-8a9b-0c1d2e3f4a5c], status: running } }
        '400':
          description: >
            bad_request dengan error.details[].code salah satu: unsupported_media_type, body_too_large, malformed_json,
            expected_object, trailing_data, too_deep, array_too_long, duplicate_key, atau invalid (withDeps/enable bukan untuk
            install).
          content: { application/json: { schema: { $ref: 'erp:common#/components/schemas/Error' } } }
        '403': { $ref: 'erp:common#/components/responses/PermissionDenied' }
        '404': { $ref: 'erp:common#/components/responses/NotFound' }
        '409':
          description: >
            invalid_state (detail invalid_transition) atau request_in_progress (detail operation_in_progress).
          content: { application/json: { schema: { $ref: 'erp:common#/components/schemas/Error' } } }
        '412': { $ref: 'erp:common#/components/responses/PreconditionFailed' }
        '415':
          description: >
            unsupported_media_type: mutasi wajib Content-Type application/json (charset utf-8); body kosong atau {} diperbolehkan.
            Ini mencegah request lintas-origin tanpa preflight CORS.
          content: { application/json: { schema: { $ref: 'erp:common#/components/schemas/Error' } } }
        '422':
          description: >
            validation_failed dengan error.details[].code unknown_field atau invalid_type (body aksi), atau
            business_rule_violated dengan error.details[].code salah satu: module_required, dependency_not_ready,
            dependents_active, module_incompatible (satu detail per masalah), downgrade_not_supported.
          content: { application/json: { schema: { $ref: 'erp:common#/components/schemas/Error' } } }
        '500': { $ref: 'erp:common#/components/responses/InternalError' }
        '503': { $ref: 'erp:common#/components/responses/NotReady' }
components:
  parameters:
    Locale:
      name: locale
      in: path
      required: true
      description: Kode bahasa terdaftar di registri bahasa (mis. id, en, en-GB).
      schema: { type: string, maxLength: 16 }
    Namespace:
      name: namespace
      in: path
      required: true
      description: ui, platform, atau slug modul aktif.
      schema: { type: string, maxLength: 50 }
    OverrideNamespace:
      name: namespace
      in: path
      required: true
      schema: { type: string, maxLength: 50 }
    OverrideLocale:
      name: locale
      in: path
      required: true
      schema: { type: string, maxLength: 16 }
    OverrideKey:
      name: key
      in: path
      required: true
      description: Kunci lengkap bertitik pada katalog bawaan (mis. note.title).
      schema: { type: string, maxLength: 200, pattern: '^[A-Za-z0-9_.-]+$' }
    Key:
      name: key
      in: path
      required: true
      description: Key modul, mis. acme.example.
      schema: { type: string }
  schemas:
    BootstrapEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [appVersion, tenantId, modules, permissions, revision]
          properties:
            appVersion: { type: string }
            tenantId: { $ref: 'erp:common#/components/schemas/Uuid' }
            modules:
              type: array
              items:
                type: object
                required: [key, slug, version, status, basePath, offline]
                properties:
                  key: { type: string }
                  slug: { type: string }
                  version: { type: string }
                  status: { $ref: '#/components/schemas/ModuleStatus' }
                  basePath: { type: string }
                  offline: { type: boolean }
            permissions: { type: array, items: { type: string } }
            revision: { type: integer, format: int64 }
            features:
              type: object
              description: Bendera kemampuan server untuk UI (additive).
              required: [modulesAdminApi]
              properties:
                modulesAdminApi: { type: boolean, description: 'API mutasi /api/platform/modules aktif (ERP_ENV=development atau ERP_MODULES_ADMIN_API=true).' }
            i18n:
              type: object
              description: Bahasa yang didukung dan revisi katalog per namespace aktif (PRD-000 FR-25); frontend memuat ulang katalog bila revisinya berubah.
              required: [defaultLocale, locales, revisions]
              properties:
                defaultLocale: { type: string }
                locales:
                  type: array
                  items:
                    type: object
                    required: [code, name]
                    properties:
                      code: { type: string }
                      name: { type: string }
                revisions:
                  type: object
                  additionalProperties: { type: string }
    I18nOverrideBody:
      type: object
      additionalProperties: false
      required: [message]
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 2000
          description: Pesan ICU MessageFormat pengganti; argumen harus sama dengan pesan bawaan; tanpa HTML.
          x-erp-classification: internal
    I18nOverridePreconditionDetails:
      type: object
      description: Bentuk error.details pada 412 version_mismatch override (OverrideView terbaru; hilang bila baris belum ada).
      required: [current]
      properties:
        current: { $ref: '#/components/schemas/I18nOverride' }
    I18nOverride:
      type: object
      required: [namespace, locale, key, message, etag, updatedBy, updatedAt]
      properties:
        namespace: { type: string }
        locale: { type: string }
        key: { type: string }
        message:
          type: string
          x-erp-classification: internal
        etag: { type: string, description: 'ETag kuat baris (hash isi); dipakai pada If-Match.' }
        updatedBy: { type: string, description: 'api:dev atau cli:<pengguna>.' }
        updatedAt: { $ref: 'erp:common#/components/schemas/Timestamp' }
    I18nCatalogEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [locale, namespace, revision, messages]
          properties:
            locale: { type: string }
            namespace: { type: string }
            revision:
              type: string
              description: 'Revisi namespace (sama dengan bootstrap.i18n.revisions[namespace]).'
            messages:
              type: object
              description: Kunci lengkap bertitik ke pesan ICU MessageFormat.
              additionalProperties: { type: string }
    ModuleStatus:
      type: string
      enum: [available, installed, enabled, disabled, upgrade_pending, failed, uninstalled, missing, incompatible]
    Dependency:
      type: object
      required: [module, version, optional]
      properties:
        module: { type: string }
        version: { type: string }
        optional: { type: boolean }
    Module:
      type: object
      required: [key, slug, name, binaryVersion, installedVersion, status, required, compatible, incompatibleCodes, dependencies, dependents, lastOperationId]
      properties:
        key: { type: string }
        slug: { type: string }
        name: { type: string }
        binaryVersion: { type: string }
        installedVersion: { type: [string, 'null'] }
        status: { $ref: '#/components/schemas/ModuleStatus' }
        required: { type: boolean }
        compatible: { type: boolean }
        incompatibleCodes: { type: array, items: { type: string } }
        dependencies: { type: array, items: { $ref: '#/components/schemas/Dependency' } }
        dependents: { type: array, items: { type: string } }
        lastOperationId: { type: [string, 'null'], format: uuid }
    Step:
      type: object
      required: [name, status, startedAt, durationMs, error]
      properties:
        name: { type: string }
        status: { type: string, enum: [running, succeeded, failed, skipped] }
        startedAt: { $ref: 'erp:common#/components/schemas/Timestamp' }
        durationMs: { type: integer, format: int64 }
        error: { type: [string, 'null'] }
    Operation:
      type: object
      required: [id, moduleKey, operation, fromVersion, toVersion, status, steps, failure, actor, startedAt, finishedAt]
      properties:
        id: { $ref: 'erp:common#/components/schemas/Uuid' }
        moduleKey: { type: string }
        operation: { type: string, enum: [install, enable, disable, upgrade, uninstall, reconcile] }
        fromVersion: { type: [string, 'null'] }
        toVersion: { type: [string, 'null'] }
        status: { type: string, enum: [running, succeeded, failed] }
        steps: { type: array, items: { $ref: '#/components/schemas/Step' } }
        failure:
          type: [object, 'null']
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
            step: { type: string }
        actor: { type: string }
        startedAt: { $ref: 'erp:common#/components/schemas/Timestamp' }
        finishedAt:
          oneOf:
            - { $ref: 'erp:common#/components/schemas/Timestamp' }
            - { type: 'null' }
    Event:
      type: object
      required: [id, moduleKey, event, actor, operationId, details, occurredAt]
      properties:
        id: { $ref: 'erp:common#/components/schemas/Uuid' }
        moduleKey: { type: string }
        event:
          type: string
          description: installed, enabled, disabled, upgraded, uninstalled, operation_failed, interrupted, retried, reconciled.
        actor: { type: string, description: 'cli:<user>, api:dev, system:reconcile, atau system:migrate.' }
        operationId:
          oneOf:
            - { $ref: 'erp:common#/components/schemas/Uuid' }
            - { type: 'null' }
        details: { type: object, additionalProperties: true }
        occurredAt: { $ref: 'erp:common#/components/schemas/Timestamp' }
    ActionBody:
      type: object
      additionalProperties: false
      properties:
        withDeps: { type: boolean, description: Sertakan dependensi wajib (hanya install). }
        enable: { type: boolean, description: Aktifkan setelah install (hanya install). }
