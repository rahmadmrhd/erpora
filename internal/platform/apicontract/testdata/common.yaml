openapi: 3.1.0
info: { title: common, version: 0.0.1 }
paths: {}
components:
  schemas:
    Uuid: { type: string, format: uuid }
    Timestamp: { type: string, format: date-time }
    Page:
      type: object
      required: [page, pageSize, total, hasMore]
      properties:
        page: { type: integer, minimum: 1 }
        pageSize: { type: integer, minimum: 1 }
        total: { type: integer }
        hasMore: { type: boolean }
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code: { type: string }
            message: { type: string }
  parameters:
    Page:
      name: page
      in: query
      schema: { type: integer, minimum: 1 }
  responses:
    BadRequest:
      description: Parameter salah.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    NotFound:
      description: Tidak ada.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
