schemaVersion: "1"
kind: abstract
key: sdk.document
export: true
description: Dasar dokumen transaksional. Menyertakan sdk.audit, menambah status (siklus hidup baku, tabel transisi bawaan dipegang resolver) dan amendedFromId, dan terkunci setelah keluar dari draft.
include:
  - source: sdk:audit
fields:
  status: {type: enum, values: [draft, deleted, pending_approval, accepted, rejected, cancelled, done], default: draft, readOnly: true, filterable: true, sortable: true}
  amendedFromId: {type: uuid, nullable: true, readOnly: true, filterable: true}
lockWhen: {field: status, op: ne, value: draft}
