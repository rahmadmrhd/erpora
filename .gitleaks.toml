title = "ERPora gitleaks"

[extend]
useDefault = true

# Bentuk [allowlist] tunggal dipakai karena gitleaks-action (8.24.x) tidak menerapkan `regexes` pada [[allowlists]].
[allowlist]
description = "Bukan rahasia: nilai contoh pengembangan lokal dan nama file migrasi goose (kolom migration_key)"
paths = ['''^\.env\.example$''', '''^infrastructure/docker/docker-compose\.dev\.yml$''']
regexes = ['''^[0-9]{4}_[a-z0-9_]+\.sql$''']
